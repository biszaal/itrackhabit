<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="iTrackHabit app icon (light)">
  <!-- Hero app icon: cream tile + two-tone mark. Corners shown for preview;
       iOS masks them automatically, so the shipped icon.png is a full square. -->
