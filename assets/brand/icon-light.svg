  <g transform="translate(512,512) scale(7.53) translate(-50,-48)">
    <circle cx="50" cy="24" r="10" fill="#6366F1"/>
    <rect x="42" y="42" width="16" height="40" rx="8" fill="#1A2B45"/>
  </g>
</svg>
