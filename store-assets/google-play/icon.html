<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Google Play hi-res icon, 512x512 32-bit PNG. Rendered on a transparent
     page so the output carries an alpha channel, which Play asks for. -->
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: transparent; }
  img { display: block; width: 512px; height: 512px; }
</style>
</head>
<body><img src="../../assets/icon.png" alt=""></body>
</html>
